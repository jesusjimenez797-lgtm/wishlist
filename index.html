<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Happy Birthday Alexa Gualdrón! 🎂🎉</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;600&display=swap');

    :root {
      --pink: #ff477e;
      --purple: #7209b7;
      --yellow: #f72585;
      --bg: #1a0826;
      --card-bg: #ffffff;
      --text: #2b2d42;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #10002b 0%, #240046 50%, #3c096c 100%);
      color: #fff;
      padding: 20px 10px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Globos animados de fondo */
    .balloon {
      position: fixed;
      bottom: -100px;
      opacity: 0.7;
      border-radius: 50%;
      animation: floatUp 12s infinite ease-in;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
      100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
    }

    .container {
      width: 100%;
      max-width: 950px;
      display: flex;
      flex-direction: column;
      gap: 25px;
      z-index: 10;
    }

    /* Party Banner Header */
    header {
      text-align: center;
      background: linear-gradient(135deg, #f72585 0%, #7209b7 100%);
      color: white;
      padding: 35px 20px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(247, 37, 133, 0.4);
      position: relative;
      border: 3px solid rgba(255,255,255,0.2);
    }

    header h1 {
      font-size: 36px;
      margin-bottom: 5px;
      text-shadow: 3px 3px 0px #3c096c;
      letter-spacing: 1px;
    }

    header p {
      font-size: 18px;
      color: #ffde00;
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .btn-party {
      background: #ffde00;
      color: #1a0826;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 222, 0, 0.4);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .btn-party:hover {
      transform: scale(1.08) rotate(-2deg);
      background: #ffffff;
    }

    /* Reproductor de Video MP4 local */
    .video-container {
      margin-top: 20px;
      border-radius: 16px;
      overflow: hidden;
      display: inline-block;
      max-width: 100%;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      border: 3px solid #ffde00;
      background: #000;
    }

    .video-container video {
      width: 320px;
      max-width: 100%;
      display: block;
    }

    /* Contador Regresivo */
    .countdown-box {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      border: 2px dashed rgba(255, 222, 0, 0.5);
    }

    .countdown-title {
      font-size: 16px;
      font-weight: bold;
      color: #ffde00;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .timer-grid {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .timer-segment {
      background: rgba(0, 0, 0, 0.3);
      padding: 12px 18px;
      border-radius: 16px;
      min-width: 70px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .timer-number {
      font-size: 28px;
      font-weight: bold;
      color: #ffffff;
    }

    .timer-label {
      font-size: 12px;
      color: #ff758c;
    }

    /* Layout Dynamic */
    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 25px;
    }

    @media (min-width: 768px) {
      .layout {
        grid-template-columns: 1fr 1fr;
      }
    }

    .panel {
      background: rgba(255, 255, 255, 0.95);
      color: var(--text);
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .panel h2 {
      font-size: 22px;
      color: var(--purple);
      border-bottom: 3px solid #ffccd5;
      padding-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      color: #444;
    }

    input[type="text"], input[type="password"], textarea, select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0aaff;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    input[type="file"] {
      padding: 8px;
      border: 2px dashed #e0aaff;
      border-radius: 12px;
      background: #fcf8ff;
      cursor: pointer;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--pink);
      box-shadow: 0 0 8px rgba(255, 71, 126, 0.3);
    }

    .btn-submit {
      background: linear-gradient(135deg, #f72585 0%, #7209b7 100%);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(114, 9, 183, 0.3);
      transition: transform 0.2s;
    }

    .btn-submit:hover {
      transform: scale(1.02);
    }

    /* Muro de Tarjetas Festivas */
    .cards-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-height: 550px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .festive-card {
      background: #fff0f5;
      border: 2px solid #ffb3c1;
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: transform 0.2s;
    }

    .festive-card:hover {
      transform: translateY(-3px) rotate(0.5deg);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge-tag {
      background: var(--purple);
      color: white;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: bold;
    }

    .card-author {
      font-weight: bold;
      font-size: 16px;
      color: #7209b7;
    }

    .card-body {
      font-size: 15px;
      color: #333;
      line-height: 1.4;
      white-space: pre-line;
      background: white;
      padding: 12px;
      border-radius: 10px;
      border: 1px dashed #ffb3c1;
    }

    .card-photo {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid #ffb3c1;
      margin-top: 5px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #888;
    }

    .btn-action {
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 13px;
      padding: 4px 8px;
    }

    .btn-action:hover {
      color: var(--pink);
    }

    .empty-state {
      text-align: center;
      color: #888;
      padding: 30px 0;
      font-size: 15px;
    }
  </style>
</head>
<body>

<!-- Elemento de audio local (cumple.mp3) -->
<audio id="audioDiomedes" loop src="cumple.mp3"></audio>

<!-- Globos Flotantes de Fondo -->
<div class="balloon" style="left: 10%; width: 40px; height: 50px; background: #f72585; animation-delay: 0s;"></div>
<div class="balloon" style="left: 30%; width: 50px; height: 60px; background: #7209b7; animation-delay: 3s;"></div>
<div class="balloon" style="left: 60%; width: 35px; height: 45px; background: #ffde00; animation-delay: 6s;"></div>
<div class="balloon" style="left: 85%; width: 45px; height: 55px; background: #4cc9f0; animation-delay: 2s;"></div>

<div class="container">

  <!-- Header Festivo -->
  <header>
    <h1>🎉 FIESTA DIGITAL DE ALEXA 🎂</h1>
    <p>¡Celebremos el Cumpleaños de Alexa Gualdrón el 26 de Noviembre!</p>
    
    <div class="header-actions">
      <button class="btn-party" onclick="lanzarConfeti()"><i class="fa-solid fa-gift"></i> ¡Lanzar Confeti!</button>
      <button class="btn-party" onclick="toggleDiomedes()"><i class="fa-solid fa-music"></i> <span id="musicText">Escuchar Diomedes Díaz 🪗</span></button>
    </div>

    <!-- Reproductor de Video MP4 local -->
    <div class="video-container">
      <video controls poster="">
        <source src="video.mp4" type="video/mp4">
        Tu navegador no soporta la reproducción de video MP4.
      </video>
    </div>
  </header>

  <!-- Contador Regresivo -->
  <div class="countdown-box">
    <div class="countdown-title">⏳ Falta poco para el gran día</div>
    <div class="timer-grid">
      <div class="timer-segment">
        <div class="timer-number" id="days">00</div>
        <div class="timer-label">Días</div>
      </div>
      <div class="timer-segment">
        <div class="timer-number" id="hours">00</div>
        <div class="timer-label">Horas</div>
      </div>
      <div class="timer-segment">
        <div class="timer-number" id="minutes">00</div>
        <div class="timer-label">Min</div>
      </div>
      <div class="timer-segment">
        <div class="timer-number" id="seconds">00</div>
        <div class="timer-label">Seg</div>
      </div>
    </div>
  </div>

  <div class="layout">
    <!-- Formulario tipo Tarjeta con subida directa de archivos -->
    <div class="panel">
      <h2><i class="fa-solid fa-pen-to-square"></i> Dejar un Mensaje / Recuerdo</h2>
      
      <input type="hidden" id="editKey" value="">
      <input type="hidden" id="fotoBase64Existente" value="">

      <div class="form-group">
        <label for="tipo">Categoría de la Nota</label>
        <select id="tipo">
          <option value="💌 Mensaje Especial">💌 Mensaje Especial de Cumpleaños</option>
          <option value="📸 Foto / Recuerdo">📸 Foto / Recuerdo Bonito</option>
          <option value="🍕 Aporte Fiesta">🍕 Aporte para la Celebración / Torta</option>
        </select>
      </div>

      <div class="form-group">
        <label for="nombre">Tu Nombre o Apodo *</label>
        <input type="text" id="nombre" placeholder="Ej: Camilo" required>
      </div>

      <div class="form-group">
        <label for="contenido">Tu mensaje o deseo especial *</label>
        <textarea id="contenido" rows="4" placeholder="¡Escribe tus deseos de cumple o recuerda una anécdota especial con Alexa!..." required></textarea>
      </div>

      <div class="form-group">
        <label for="fotoInput">🖼️ Adjuntar una Foto / Recuerdo desde tu equipo (Opcional):</label>
        <input type="file" id="fotoInput" accept="image/*">
      </div>

      <div class="form-group">
        <label for="pin">🔒 PIN de 4 dígitos (para editar después) *</label>
        <input type="password" id="pin" maxlength="4" placeholder="1234" required>
      </div>

      <button class="btn-submit" id="btnSubmit" onclick="guardarTarjetas()"><i class="fa-solid fa-paper-plane"></i> Publicar en el Muro</button>
    </div>

    <!-- Muro y Álbum de Fotos -->
    <div class="panel">
      <h2><i class="fa-solid fa-images"></i> Muro de Mensajes y Recuerdos</h2>
      
      <div class="cards-container" id="cardsContainer">
        <div class="empty-state">Cargando las sorpresas... 🎈</div>
      </div>
    </div>
  </div>
</div>

<script>
  // Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyDDIydBQIA2r9aEYQr3hKvpPEB1p8kueTc",
    authDomain: "amor-y-amistad-25dfa.firebaseapp.com",
    databaseURL: "https://amor-y-amistad-25dfa-default-rtdb.firebaseio.com",
    projectId: "amor-y-amistad-25dfa",
    storageBucket: "amor-y-amistad-25dfa.firebasestorage.app",
    messagingSenderId: "596707897670",
    appId: "1:596707897670:web:80874fc8a24fd17fde7547",
    measurementId: "G-C8EKTZVP9G"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();
  const partyRef = database.ref('fiesta_alexa');

  let publicaciones = {};

  partyRef.on('value', (snapshot) => {
    publicaciones = snapshot.val() || {};
    renderizarMuro(publicaciones);
  });

  // Función para comprimir/convertir imagen local a formato de texto comprimido
  function procesarImagen(file, callback) {
    if (!file) {
      callback(null);
      return;
    }
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 800;
        let width = img.width;
        let height = img.height;

        if (width > MAX_WIDTH) {
          height = Math.round((height * MAX_WIDTH) / width);
          width = MAX_WIDTH;
        }

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        
        // Exportar como JPEG comprimido para optimizar velocidad y espacio
        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
        callback(dataUrl);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function guardarTarjetas() {
    const editKey = document.getElementById('editKey').value;
    const tipo = document.getElementById('tipo').value;
    const nombre = document.getElementById('nombre').value.trim();
    const contenido = document.getElementById('contenido').value.trim();
    const pin = document.getElementById('pin').value.trim();
    const fileInput = document.getElementById('fotoInput');
    const fotoExistente = document.getElementById('fotoBase64Existente').value;

    if (!nombre || !contenido || !pin) {
      alert("Por favor completa tu nombre, mensaje y PIN de 4 dígitos.");
      return;
    }

    const archivoFoto = fileInput.files[0];

    // Procesar la foto seleccionada (si la hay)
    procesarImagen(archivoFoto, function(fotoBase64) {
      const fotoFinal = fotoBase64 || fotoExistente || '';

      const datos = {
        tipo: tipo,
        nombre: nombre,
        contenido: contenido,
        foto: fotoFinal,
        pin: pin,
        fecha: new Date().toLocaleDateString()
      };

      if (editKey) {
        partyRef.child(editKey).update(datos, () => {
          alert("¡Tarjeta actualizada!");
          limpiarForm();
        });
      } else {
        partyRef.push(datos, () => {
          lanzarConfeti();
          alert("¡Tu mensaje y foto fueron publicados en el muro!");
          limpiarForm();
        });
      }
    });
  }

  function renderizarMuro(datos) {
    const container = document.getElementById('cardsContainer');
    container.innerHTML = '';

    const keys = Object.keys(datos).reverse();

    if (keys.length === 0) {
      container.innerHTML = '<div class="empty-state">¡Aún no hay mensajes! Sé el primero en dejarle una felicitación a Alexa 🎈</div>';
      return;
    }

    keys.forEach(key => {
      const item = datos[key];
      const card = document.createElement('div');
      card.className = 'festive-card';

      let fotoHTML = item.foto ? `<img class="card-photo" src="${item.foto}" alt="Foto Recuerdo" onerror="this.style.display='none'">` : '';

      card.innerHTML = `
        <div class="card-header">
          <span class="card-author"><i class="fa-solid fa-user-tag"></i> ${item.nombre}</span>
          <span class="badge-tag">${item.tipo}</span>
        </div>
        <div class="card-body">${item.contenido}</div>
        ${fotoHTML}
        <div class="card-footer">
          <span>📅 ${item.fecha}</span>
          <div>
            <button class="btn-action" onclick="solicitarEditar('${key}')"><i class="fa-solid fa-pen"></i> Editar</button>
            <button class="btn-action" onclick="solicitarEliminar('${key}')"><i class="fa-solid fa-trash"></i> Borrar</button>
          </div>
        </div>
      `;

      container.appendChild(card);
    });
  }

  function solicitarEditar(key) {
    const item = publicaciones[key];
    const pinIngresado = prompt("Ingresa tu PIN de 4 dígitos:");
    if (pinIngresado === item.pin) {
      document.getElementById('editKey').value = key;
      document.getElementById('tipo').value = item.tipo;
      document.getElementById('nombre').value = item.nombre;
      document.getElementById('contenido').value = item.contenido;
      document.getElementById('fotoBase64Existente').value = item.foto || '';
      document.getElementById('pin').value = item.pin;
      document.getElementById('btnSubmit').innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Guardar Cambios';
    } else if (pinIngresado !== null) {
      alert("❌ PIN incorrecto");
    }
  }

  function solicitarEliminar(key) {
    const item = publicaciones[key];
    const pinIngresado = prompt("Ingresa tu PIN de 4 dígitos para borrar:");
    if (pinIngresado === item.pin) {
      partyRef.child(key).remove();
    } else if (pinIngresado !== null) {
      alert("❌ PIN incorrecto");
    }
  }

  function limpiarForm() {
    document.getElementById('editKey').value = '';
    document.getElementById('fotoBase64Existente').value = '';
    document.getElementById('nombre').value = '';
    document.getElementById('contenido').value = '';
    document.getElementById('fotoInput').value = '';
    document.getElementById('pin').value = '';
    document.getElementById('btnSubmit').innerHTML = '<i class="fa-solid fa-paper-plane"></i> Publicar en el Muro';
  }

  function lanzarConfeti() {
    confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
  }

  // Reproducción de Diomedes Díaz MP3
  let reproduciendoAudio = false;
  function toggleDiomedes() {
    const audio = document.getElementById('audioDiomedes');
    if (reproduciendoAudio) {
      audio.pause();
      document.getElementById('musicText').innerText = "Escuchar Diomedes Díaz 🪗";
    } else {
      audio.play().catch(() => alert("Por favor asegúrate de haber subido el archivo cumple.mp3 a GitHub."));
      document.getElementById('musicText').innerText = "Pausar Diomedes 🎵";
    }
    reproduciendoAudio = !reproduciendoAudio;
  }

  // Contador
  function actualizarContador() {
    const ahora = new Date();
    let anoActual = ahora.getFullYear();
    let fechaCumple = new Date(anoActual, 10, 26);

    if (ahora > fechaCumple) {
      fechaCumple = new Date(anoActual + 1, 10, 26);
    }

    const diff = fechaCumple - ahora;
    document.getElementById('days').innerText = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
    document.getElementById('hours').innerText = String(Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
    document.getElementById('minutes').innerText = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
    document.getElementById('seconds').innerText = String(Math.floor((diff % (1000 * 60)) / 1000)).padStart(2, '0');
  }

  setInterval(actualizarContador, 1000);
  actualizarContador();
</script>

</body>
</html>
